# Integración continua: se ejecuta en cada PR y en cada cambio de main.
# Si cualquier paso falla, el trabajo falla y el PR queda en rojo.
# Las acciones están fijadas por commit (SHA) y no por etiqueta; el comentario indica la versión.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a la misma rama de trabajo cancela la ejecución anterior que sigue en curso.
# En main nunca se cancela: si se fusionan dos PR seguidos, cada commit conserva su resultado
# y un fallo intermedio no queda oculto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faro
          POSTGRES_PASSWORD: faro-ci-no-es-secreto
          POSTGRES_DB: faro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faro -d faro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Base efímera del propio trabajo: no contiene datos ni credenciales reales.
      DATABASE_URL: postgresql://faro:faro-ci-no-es-secreto@localhost:5432/faro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build
      - name: Migraciones (por CLI, sobre una base vacía)
        run: npm run db:migrate -w apps/api
      - name: Siembra de usuarios ficticios (comprueba también que argon2 carga en Linux)
        run: npm run db:seed -w apps/api
        env:
          SEMILLA_CLAVE: clave-ci-sin-valor-real
      - name: Importación del cuadro desde CSV (comando compilado, CSV ficticio sobre la base sembrada)
        # Comprueba que el comando de la imagen corre en Linux, que la simulación no escribe y que repetir no cambia nada.
        run: |
          CCD="node apps/api/dist/ccd/importar/importar-cli.js docs/ejemplos/cuadro-ejemplo.csv"
          $CCD | tee "$RUNNER_TEMP/ccd1.txt"
          grep -F "SIMULACIÓN" "$RUNNER_TEMP/ccd1.txt"
          $CCD --aplicar | tee "$RUNNER_TEMP/ccd2.txt"
          grep -F "Importación aplicada" "$RUNNER_TEMP/ccd2.txt"
          $CCD --aplicar | tee "$RUNNER_TEMP/ccd3.txt"
          grep -F "no hay nada que cambiar" "$RUNNER_TEMP/ccd3.txt"
      - name: Almacén S3 (RustFS) para las pruebas del adaptador
        # Las claves son las de ejemplo de .env.example: un almacén efímero del propio trabajo.
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --wait almacen
          docker compose --env-file .env -f infra/docker-compose.yml run --rm almacen-init
      - name: Pruebas de integración (contra PostgreSQL y el almacén S3)
        run: npm run test:e2e

  legacy:
    name: legacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy/prototipo-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/prototipo-v1/package-lock.json
      - run: npm ci
      - name: Pruebas del prototipo v1
        run: npm test

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar docker-compose con las variables de ejemplo
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet

  # Que el Dockerfile de la API siga compilando y la imagen siga siendo segura: sin esto se pudre sin que
  # nadie lo note hasta el día del despliegue. No sube nada a ningún registro.
  imagen:
    name: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir la imagen de la API
        run: docker build -f apps/api/Dockerfile -t faro-api:ci .
      - name: Comprobar que no corre como administrador ni trae pruebas, fuentes ni .env
        run: |
          usuario="$(docker run --rm --entrypoint id faro-api:ci -u)"
          echo "uid del proceso: $usuario"
          test "$usuario" != "0"
          docker run --rm --entrypoint sh faro-api:ci -c '! test -e /app/apps/api/test && ! test -e /app/apps/api/src && ! test -e /app/.env && test -f /app/apps/api/dist/main.js && test -f /app/apps/api/dist/base-datos/migrar-cli.js && test -d /app/apps/api/drizzle'

  # Busca secretos (claves, tokens, contraseñas) en TODO el historial del repositorio, no solo en el último
  # commit: el repositorio es público y un secreto subido por error ya está expuesto aunque se borre después.
  # Usa la imagen oficial fijada por huella (digest) en lugar de la acción, que pide licencia a las organizaciones.
  # Lo permitido está en .gitleaks.toml y cada excepción lleva su justificación.
  secretos:
    name: secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Buscar secretos en el historial completo (gitleaks v8.30.1)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner
