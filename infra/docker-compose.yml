# Entorno local de Faro: PostgreSQL y almacén de archivos compatible con S3.
# Solo para desarrollo y pruebas, con datos ficticios. No es infraestructura institucional.
#
# Uso (desde la raíz del repositorio):
#   cp .env.example .env        # y cambiar las claves
#   npm run infra:up
#
# Las variables se leen de .env (fuera de git). Si falta alguna, Compose falla con un mensaje.

name: faro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER. Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB. Copia .env.example a .env}
    ports:
      # Solo accesible desde este equipo. Puerto 5433 para no chocar con un PostgreSQL local.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Almacén de objetos con API S3. Reemplaza a MinIO: sus imágenes oficiales ya no
  # se publican (Docker Hub devuelve "object not found" y Quay no tiene manifiestos
  # públicos; verificado el 22 de noviembre de 2026).
  # La API habla S3 estándar, así que el mismo adaptador sirve con cualquier almacén
  # compatible (RustFS aquí; en la nube, Cloud Storage con su modo interoperable).
  almacen:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY. Copia .env.example a .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Falta S3_SECRET_KEY. Copia .env.example a .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - almacen-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Crea el bucket al arrancar. Termina solo; es seguro repetirlo.
  almacen-init:
    image: curlimages/curl:8.23.0
    depends_on:
      almacen:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY. Copia .env.example a .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Falta S3_SECRET_KEY. Copia .env.example a .env}
      S3_BUCKET: ${S3_BUCKET:?Falta S3_BUCKET. Copia .env.example a .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        codigo=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 "aws:amz:us-east-1:s3" --user "$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}" \
          "http://almacen:9000/$${S3_BUCKET}")
        case "$$codigo" in
          200|409) echo "Bucket '$${S3_BUCKET}' listo (HTTP $$codigo)." ;;
          *) echo "No se pudo crear el bucket '$${S3_BUCKET}' (HTTP $$codigo)." >&2; exit 1 ;;
        esac

volumes:
  postgres-data:
  almacen-data:
